services:
  postgres:
    image: postgres:16-alpine
    container_name: synora-postgres
    environment:
      POSTGRES_DB: synora
      POSTGRES_USER: synora
      POSTGRES_PASSWORD: synora
    ports:
      - "5432:5432"
    volumes:
      - synora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synora -d synora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  synora_pgdata:
